name: Votic Mobile Dependency Security Report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"
  push:
    paths:
      - "apps/mobile/package.json"
      - "apps/mobile/package-lock.json"

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Get Votic's code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install mobile dependencies
        run: npm install --ignore-scripts
      - name: Generate dependency security report
        run: node ../../security/generate-mobile-dependency-report.cjs
      - name: Commit updated security report
        working-directory: .
        run: |
          if git diff --quiet -- security/mobile-dependency-report.md; then
            echo "Security report is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/mobile-dependency-report.md
          git commit -m "Update mobile dependency security report"
          git push
