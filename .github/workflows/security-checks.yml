name: Votic Code Quality & Security Checks

on:
  push:
  pull_request:
  workflow_dispatch:


jobs:
  security:
    name: Quality, Security, and Test Checks
    runs-on: ubuntu-latest

    steps:
      - name: Get Votic's code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      
      - name: Install Votic dependencies
        run: npm ci

      - name: Check JavaScript with ESLint
        run: npm run lint

      - name: Validate Votic HTML
        run: npm run lint:html

      - name: Check Votic CSS with Stylelint
        run: npm run lint:css

      - name: Run Votic automated tests
        run: npm test

      - name: Check dependencies for vulnerabilities
        run: npm audit

      - name: Install Semgrep
        run: pip install semgrep

      - name: Scan Votic source code with Semgrep
        run: semgrep scan --config auto .

      - name: Scan repository for exposed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
